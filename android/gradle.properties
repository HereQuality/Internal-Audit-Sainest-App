# --enable-native-access=ALL-UNNAMED silences the JDK 24+ JEP 472
# "restricted method... System::load" warning that Gradle's own
# native-platform library (file-watching) triggers on Android Studio's
# bundled JDK 25 — harmless today, but JEP 472 turns this into a hard
# error on a future JDK release, so this needs to stay until Gradle ships
# a build that declares native access via its own module descriptor.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
